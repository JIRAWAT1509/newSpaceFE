<!-- payment-method.component.html -->
<div class="payment-method-section">

  @if (transfers().length > 0) {
    <div class="payment-table-section">
      <div class="table-header-row">
        <h6>{{ title() }}</h6>
        <button type="button" class="btn-add-sm" (click)="addTransfer.emit()">
          <i class="pi pi-plus"></i>
        </button>
      </div>

      <table class="data-table-sm">
        <thead>
          <tr>
            <th>วันที่โอน</th>
            <th>จำนวนเงิน</th>
            <th>ธนาคาร</th>
            <th>สาขา</th>
            <th>บริษัท</th>
            <th class="w-16"></th>
          </tr>
        </thead>
        <tbody>
          @for (item of transfers(); track $index) {
            <tr>
              <td><p-datepicker [(ngModel)]="item.date" [ngModelOptions]="{standalone: true}" dateFormat="dd/mm/yy" styleClass="w-full"></p-datepicker></td>
              <td><input type="number" pInputText [(ngModel)]="item.amount" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><input type="text" pInputText [(ngModel)]="item.bank" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><input type="text" pInputText [(ngModel)]="item.branch" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><input type="text" pInputText [(ngModel)]="item.company" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><button type="button" class="btn-icon-delete-sm" (click)="removeTransfer.emit($index)"><i class="pi pi-trash"></i></button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

  @if (checks().length > 0) {
    <div class="payment-table-section">
      <div class="table-header-row">
        <h6>{{ title() }}</h6>
        <button type="button" class="btn-add-sm" (click)="addCheck.emit()">
          <i class="pi pi-plus"></i>
        </button>
      </div>

      <table class="data-table-sm">
        <thead>
          <tr>
            <th>เช็คเลขที่</th>
            <th>ลงวันที่</th>
            <th>จำนวนเงิน</th>
            <th>ธนาคาร</th>
            <th>สาขา</th>
            <th>บริษัท</th>
            <th class="w-16"></th>
          </tr>
        </thead>
        <tbody>
          @for (item of checks(); track $index) {
            <tr>
              <td><input type="text" pInputText [(ngModel)]="item.checkNumber" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><p-datepicker [(ngModel)]="item.date" [ngModelOptions]="{standalone: true}" dateFormat="dd/mm/yy" styleClass="w-full"></p-datepicker></td>
              <td><input type="number" pInputText [(ngModel)]="item.amount" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><input type="text" pInputText [(ngModel)]="item.bank" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><input type="text" pInputText [(ngModel)]="item.branch" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><input type="text" pInputText [(ngModel)]="item.company" [ngModelOptions]="{standalone: true}" class="w-full" /></td>
              <td><button type="button" class="btn-icon-delete-sm" (click)="removeCheck.emit($index)"><i class="pi pi-trash"></i></button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
