<div class="auth-page">
  <div class="auth-bg" [style.backgroundImage]="bgImage">
    <div class="auth-overlay" aria-hidden="true"></div>
    <div class="auth-content">
      <section class="auth-panel" aria-labelledby="login-title">
        <div class="auth-welcome">
          <h1 class="auth-welcome-title" id="login-title">Welcome to Space</h1>
          <p class="auth-welcome-sub">Sign in to continue</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="auth-form">
          <div class="auth-field-wrap">
            <label class="auth-field">
              <span class="auth-field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <circle cx="12" cy="8" r="3.5"/>
                  <path d="M5 20.5c0-3.5 3.5-6 7-6s7 2.5 7 6"/>
                </svg>
              </span>
              <input
                id="username"
                type="text"
                [(ngModel)]="username"
                name="username"
                placeholder="Username"
                autocomplete="username"
                aria-label="Username"
              />
            </label>
          </div>

          <div class="auth-field-wrap">
            <label class="auth-field">
              <span class="auth-field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                id="password"
                type="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                aria-label="Password"
              />
            </label>
          </div>

          <div class="auth-field-wrap">
            <label class="auth-field auth-field-select">
              <span class="auth-field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
              </span>
              <select id="company" [(ngModel)]="companyId" name="company" aria-label="Company">
                @for (company of companyOptions; track company.value) {
                  <option [value]="company.value">{{ company.label }}</option>
                }
              </select>
              <span class="auth-select-chevron" aria-hidden="true">▼</span>
            </label>
          </div>

          @if (error) {
            <p class="auth-error" role="alert">{{ error }}</p>
          }

          <button type="submit" class="auth-submit" [disabled]="loading">
            @if (loading) {
              <span class="auth-spinner" aria-hidden="true"></span>
              <span class="auth-submit-text">Signing in...</span>
            } @else {
              <span class="auth-submit-text">Sign In</span>
            }
          </button>
        </form>

        <div class="auth-actions">
          <a routerLink="/forgot-password" class="auth-link-right">Forgot password?</a>
        </div>
      </section>
    </div>
  </div>
</div>
