<div class="auth-page">
  <div class="auth-bg">
    <div class="auth-bg-gradient"></div>
    <div class="auth-waves">
      <svg class="auth-waves-svg" viewBox="0 0 1440 800" preserveAspectRatio="none">
        <path fill="rgba(255,255,255,0.06)" d="M0,400 Q360,200 720,400 T1440,400 L1440,800 L0,800 Z"/>
        <path fill="rgba(255,255,255,0.08)" d="M0,500 Q360,300 720,500 T1440,500 L1440,800 L0,800 Z"/>
      </svg>
    </div>
    <div class="auth-bg-shapes">
      <span class="shape shape-1"></span>
      <span class="shape shape-2"></span>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-card auth-card-single">
      <div class="auth-card-form">
        <a routerLink="/login" class="auth-back">
          <i class="pi pi-arrow-left"></i>
          Back to Login
        </a>
        <div class="auth-brand">
          <span class="auth-brand-logo">SPACE</span>
          <p class="auth-brand-tagline">Property Management Solution</p>
        </div>

        @if (!done) {
          <h1 class="auth-title">Reset Password</h1>
          <p class="auth-subtitle">Enter your new password below. (Mock – no real reset.)</p>
          <form (ngSubmit)="onSubmit()" class="auth-form">
            @if (error) {
              <div class="auth-error" role="alert">{{ error }}</div>
            }
            <div class="auth-field">
              <label for="password">New Password</label>
              <p-password
                id="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Enter new password"
                [feedback]="true"
                [toggleMask]="true"
                inputStyleClass="auth-input w-full"
                inputId="password"
              />
            </div>
            <div class="auth-field">
              <label for="confirm">Confirm Password</label>
              <p-password
                id="confirm"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                [feedback]="false"
                [toggleMask]="true"
                inputStyleClass="auth-input w-full"
                inputId="confirm"
              />
            </div>
            <button
              type="submit"
              pButton
              label="Reset Password"
              icon="pi pi-check"
              iconPos="right"
              [loading]="loading"
              class="auth-submit w-full p-button-lg"
            ></button>
          </form>
        } @else {
          <div class="auth-success-box">
            <div class="auth-success-icon">
              <i class="pi pi-check"></i>
            </div>
            <h2 class="auth-success-title">Password reset complete</h2>
            <p class="auth-success-text">Your password has been updated (mock). You can now sign in with your new password.</p>
            <button
              type="button"
              pButton
              label="Back to Login"
              icon="pi pi-arrow-right"
              iconPos="right"
              (click)="backToLogin()"
              class="auth-submit w-full p-button-lg"
            ></button>
          </div>
        }
      </div>
    </div>
  </div>
</div>
