<div class="auth-page">
  <div class="auth-bg" [style.backgroundImage]="bgImage">
    <div class="auth-overlay" aria-hidden="true"></div>
    <div class="auth-content">
      <section class="auth-panel">
        <a routerLink="/login" class="auth-back">← Back to Login</a>

        @if (!sent) {
          <div class="auth-welcome">
            <h1 class="auth-welcome-title">Forgot Password?</h1>
            <p class="auth-welcome-sub">Enter your email or username and we'll send you a link to reset your password.</p>
          </div>

          <form (ngSubmit)="onSubmit()" class="auth-form">
            @if (error) {
              <p class="auth-error" role="alert">{{ error }}</p>
            }
            <div class="auth-field-wrap">
              <label class="auth-field">
                <span class="auth-field-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                  </svg>
                </span>
                <input
                  id="email"
                  type="text"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="Email or username"
                  autocomplete="username"
                />
              </label>
            </div>
            <button type="submit" class="auth-submit" [disabled]="loading">
              @if (loading) {
                <span class="auth-spinner" aria-hidden="true"></span>
                <span class="auth-submit-text">Sending...</span>
              } @else {
                <span class="auth-submit-text">Send Reset Link</span>
              }
            </button>
          </form>
        } @else {
          <div class="auth-welcome">
            <h1 class="auth-welcome-title">Check your inbox</h1>
            <p class="auth-welcome-sub">If an account exists for this email, we've sent instructions to reset your password.</p>
          </div>
          <div class="auth-success-actions">
            <button type="button" class="auth-submit" (click)="goToReset()">Go to Reset Password</button>
            <button type="button" class="auth-secondary-btn" (click)="backToLogin()">Back to Login</button>
          </div>
        }
      </section>
    </div>
  </div>
</div>
