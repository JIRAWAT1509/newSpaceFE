<div class="branch-master-wrapper">
  <p-confirmDialog></p-confirmDialog>
  
  <!-- Show data table first -->
  <div *ngIf="!showBranchForm">
    <!-- Header -->
    <div class="flex items-center justify-between mb-3">
      <div class="text-base font-semibold text-slate-700">
        ข้อมูลพื้นฐานระดับสาขา
      </div>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoadingBranch" class="loading-state">
      <i class="pi pi-spin pi-spinner text-slate-500 text-2xl"></i>
      <p>Loading branch level master...</p>
    </div>

    <!-- Table -->
    <p-table
      *ngIf="!isLoadingBranch && filteredBranchList.length"
      [value]="filteredBranchList"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 140px">Branch</th>
          <th>ชื่อสาขา</th>
          <th style="width: 140px">Tax Profile</th>
          <th style="width: 4rem; text-align: center;">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.branch }}</td>
          <td>{{ row.name }}</td>
          <td>{{ row.taxProfile }}</td>
          <td class="text-center">
            <div class="flex items-center justify-center gap-2">
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [text]="true"
                severity="info"
                size="small"
                (onClick)="openEditPanel(row)"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                severity="danger"
                size="small"
                (onClick)="deleteBranch(row)"
              ></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <!-- Empty -->
    <div *ngIf="!isLoadingBranch && !filteredBranchList.length" class="empty-state">
      <i class="pi pi-inbox empty-icon"></i>
      <p>No data</p>
    </div>
  </div>

  <!-- Show form when adding/editing -->
  <div *ngIf="showBranchForm" class="basic-form-wrapper">
    <div class="basic-form-header">
      <h3>{{ isEdit ? 'แก้ไขข้อมูลสาขา' : 'เพิ่มข้อมูลสาขา' }}</h3>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <!-- สาขา -->
      <div class="form-field md:col-span-2">
        <label class="form-label">* สาขา</label>
        <p-select
          [options]="branchOptions"
          [(ngModel)]="branchForm.branchCode"
          [disabled]="isEdit"
          placeholder="เลือกสาขา"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>

      <!-- ภาษีมูลค่าเพิ่ม -->
      <div class="form-field">
        <label class="form-label">* ภาษีมูลค่าเพิ่ม</label>
        <p-select
          [options]="vatOptions"
          [(ngModel)]="branchForm.vatCode"
          placeholder="เลือกภาษีมูลค่าเพิ่ม"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>

      <!-- ภาษีโรงเรือน -->
      <div class="form-field">
        <label class="form-label">* ภาษีโรงเรือน</label>
        <p-select
          [options]="houseTaxOptions"
          [(ngModel)]="branchForm.houseTaxCode"
          placeholder="เลือกภาษีโรงเรือน"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>

      <!-- อัตราภาษีโรงเรือน -->
      <div class="form-field">
        <label class="form-label">อัตรา</label>
        <input
          pInputText
          type="number"
          [(ngModel)]="branchForm.houseTaxRate"
          class="w-full text-right"
        />
      </div>

      <!-- รหัสอากรแสตมป์ -->
      <div class="form-field">
        <label class="form-label">* รหัสอากรแสตมป์</label>
        <p-select
          [options]="stampOptions"
          [(ngModel)]="branchForm.stampCode"
          placeholder="เลือกรหัสแสตมป์"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>

      <!-- รหัสสกุลเงิน -->
      <div class="form-field">
        <label class="form-label">* รหัสสกุลเงิน</label>
        <p-select
          [options]="currencyOptions"
          [(ngModel)]="branchForm.currencyCode"
          placeholder="เลือกสกุลเงิน"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>

      <!-- short term -->
      <div class="form-field">
        <label class="form-label">สัญญาเป็น short term เมื่ออายุน้อยกว่า (เดือน)</label>
        <input
          pInputText
          type="number"
          [(ngModel)]="branchForm.shortTermMonth"
          class="w-full"
        />
      </div>

      <!-- credit term -->
      <div class="form-field">
        <label class="form-label">* Credit Term</label>
        <p-select
          [options]="creditTermOptions"
          [(ngModel)]="branchForm.creditTerm"
          placeholder="เลือก Credit Term"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>

      <!-- รหัสอัตราเบี้ยประกันภัย -->
      <div class="form-field">
        <label class="form-label">* รหัสอัตราเบี้ยประกันภัย</label>
        <p-select
          [options]="insuranceOptions"
          [(ngModel)]="branchForm.insuranceCode"
          placeholder="เลือกอัตราเบี้ยประกันภัย"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>

      <!-- อัตราเบี้ยประกันภัย -->
      <div class="form-field">
        <label class="form-label">อัตรา</label>
        <input
          pInputText
          type="number"
          [(ngModel)]="branchForm.insuranceRate"
          class="w-full text-right"
        />
      </div>

      <!-- contract from -->
      <div class="form-field">
        <label class="form-label">สัญญาอายุตั้งแต่ (เดือน)</label>
        <input
          pInputText
          type="number"
          [(ngModel)]="branchForm.contractMonthFrom"
          class="w-full"
        />
      </div>

      <!-- cost center -->
      <div class="form-field">
        <label class="form-label">Cost Center ค่าธรรมเนียม</label>
        <p-select
          [options]="costCenterOptions"
          [(ngModel)]="branchForm.costCenter"
          optionLabel="name"
          optionValue="code"
          class="w-full"
        ></p-select>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="border-t border-gray-200 px-6 py-4 bg-gray-50 flex justify-end gap-3 mt-4">
      <p-button
        label="ยกเลิก"
        icon="pi pi-times"
        [outlined]="true"
        severity="secondary"
        (onClick)="cancelPanel()"
      ></p-button>
      <p-button
        label="บันทึก"
        icon="pi pi-check"
        severity="primary"
        (onClick)="saveBranch()"
      ></p-button>
    </div>
  </div>
</div>
