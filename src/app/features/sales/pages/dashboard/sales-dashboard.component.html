<!-- sales-dashboard-page.component.html - FINAL VERSION -->

<div class="dashboard-page">

  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <div>
        <h1 class="page-title">CRM Dashboard</h1>
        <p class="page-subtitle">แดชบอร์ดระบบ CRM - ภาพรวมการขาย</p>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div class="dashboard-content">

    <!-- Section 1: KPI Summary -->
    <section class="dashboard-section">
      <app-kpi-summary></app-kpi-summary>
    </section>

    <!-- Section 2: Pipeline Overview -->
    <section class="dashboard-section">
      <app-pipeline-overview></app-pipeline-overview>
    </section>

    <!-- Section 3: Customer Insights (WITHOUT At-Risk) -->
    <section class="dashboard-section">
      <app-customer-insights></app-customer-insights>
    </section>

    <!-- Section 4: Team Performance -->
    <section class="dashboard-section">
      <app-team-performance></app-team-performance>
    </section>

    <!-- Section 5: At-Risk Customers (MOVED TO BOTTOM) -->
    <section class="dashboard-section at-risk-section">
      <app-at-risk-customers-alert
        [customers]="atRiskCustomers()"
        [isLoading]="isLoadingAtRisk()"
      ></app-at-risk-customers-alert>
    </section>

  </div>

</div>
