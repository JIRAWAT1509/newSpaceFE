<!-- add-company-modal.component.html -->

<div class="modal-overlay" (click)="onClose()">

  <div class="modal-container" (click)="onModalClick($event)">

    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-content">
        <h2 class="modal-title">
          <i class="pi pi-building"></i>
          <span>Add New Company</span>
        </h2>
        <p class="modal-subtitle">Create a new company and set its annual budget</p>
      </div>
      <button class="btn-close" (click)="onClose()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">

      <!-- Company Name -->
      <div class="form-group">
        <label class="form-label">
          Company Name <span class="required">*</span>
        </label>
        <input
          type="text"
          pInputText
          class="w-full"
          placeholder="e.g., บริษัท ไทย สเปซ จำกัด"
          [(ngModel)]="name"
          (ngModelChange)="updateName($event)"
        />
      </div>

      <!-- Year -->
      <div class="form-group">
        <label class="form-label">
          Fiscal Year <span class="required">*</span>
        </label>
        <p-inputNumber
          [(ngModel)]="year"
          (ngModelChange)="updateYear($event)"
          [min]="2000"
          [max]="2100"
          [useGrouping]="false"
          styleClass="w-full"
          placeholder="2026"
        ></p-inputNumber>
        <small class="form-hint">Select the fiscal year for this budget</small>
      </div>

      <!-- Annual Budget -->
      <div class="form-group">
        <label class="form-label">
          Annual Budget <span class="required">*</span>
        </label>
        <p-inputNumber
          [(ngModel)]="budget"
          (ngModelChange)="updateBudget($event)"
          mode="currency"
          currency="THB"
          locale="th-TH"
          [min]="0"
          styleClass="w-full"
          placeholder="฿10,000,000"
        ></p-inputNumber>
        <small class="form-hint">Total budget for the fiscal year</small>
      </div>

      <!-- Info Box -->
      <div class="info-box">
        <i class="pi pi-info-circle"></i>
        <div class="info-content">
          <p class="info-title">Next Steps</p>
          <p class="info-text">After creating the company, you'll be able to add teams and allocate budgets to each team.</p>
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">
        <span>Cancel</span>
      </button>
      <button
        class="btn-save"
        (click)="onSave()"
        [disabled]="!isValid()"
      >
        <i class="pi pi-check"></i>
        <span>Create Company</span>
      </button>
    </div>

  </div>

</div>
