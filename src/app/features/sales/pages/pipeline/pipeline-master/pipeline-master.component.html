<!-- pipeline-master.component.html -->

<div class="pipeline-page">

  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">🪜</div>
      <div class="header-title">
        <h1>Sales Pipeline Management</h1>
        <p>จัดการกระบวนการขาย และติดตามดีลจนปิดสัญญา</p>
      </div>
    </div>
    <div class="header-actions">
      <button
        class="btn btn-secondary"
        (click)="onConfigureStages()"
        type="button"
      >
        <span class="btn-icon">⚙️</span>
        <span class="btn-label">Configure Stages</span>
      </button>
      <button
        class="btn btn-primary"
        (click)="onAddDeal()"
        type="button"
      >
        <span class="btn-icon">+</span>
        <span class="btn-label">Add Deal</span>
      </button>
    </div>
  </div>

  <!-- Pipeline Metrics -->
  <app-pipeline-metrics
    [metrics]="pipelineMetrics()"
    [activeHotFilter]="activeHotFilter()"
    (hotFilterChange)="onHotFilterChange($event)"
  />

  <!-- Pipeline Filters -->
  <app-pipeline-filters
    [owners]="uniqueOwners()"
    [tags]="uniqueTags()"
    (filterChange)="onFilterChange($event)"
  />

  <!-- Kanban Board -->
  <div class="kanban-container">
    <app-kanban-board
      [stages]="stages()"
      [dealsByStage]="dealsByStage()"
      [stageViewConfigs]="stageViewConfigs()"
      (stageSortChange)="onStageSortChange($event)"
      (stagePageChange)="onStagePageChange($event)"
      (stageSettings)="onStageSettings($event)"
      (dealClicked)="onDealClicked($event)"
      (dealMenuClicked)="onDealMenuClicked($event)"
      (dealMoved)="onDealMoved($event)"
    />
  </div>

  <!-- Add Deal Modal -->
  <app-add-deal-modal
    #addDealModal
    (save)="onAddDealSave($event)"
  />

  <!-- Edit Deal Modal -->
  <app-edit-deal-modal
    #editDealModal
    (save)="onEditDealSave($event)"
  />

  <!-- Stage Config Modal -->
  <app-stage-config-modal
    #stageConfigModal
    (save)="onStageConfigSave($event)"
  />

  <!-- Deal Detail Modal -->
  <app-deal-detail-modal
    #dealDetailModal
    (action)="onDealDetailAction($event)"
  />

</div>
