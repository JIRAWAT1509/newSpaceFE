<!-- kanban-board.component.html (FIXED - USES STAGE-COLUMN) -->

<div class="kanban-board">

  @for (stage of stages(); track stage.id) {
    <app-stage-column
      [stage]="stage"
      [deals]="getStageDeals(stage.id)"
      [viewConfig]="getStageConfig(stage.id)"
      [metrics]="getStageMetrics(stage.id)"
      [isDraggingGlobal]="isDragging()"
      [globalMousePosition]="currentMousePosition()"
      [currentDragDealId]="currentDragDealId"
      (sortChange)="onSortChange(stage.id, $event)"
      (pageChange)="onPageChange(stage.id, $event)"
      (cardsPerPageChange)="onCardsPerPageChange(stage.id, $event)"
      (settingsClick)="onSettingsClick(stage.id)"
      (dealClick)="onDealClick($event)"
      (dealMenuClick)="onDealMenu($event)"
      (dealDragStart)="onDealDragStart($event)"
      (dealDragEnd)="onDealDragEnd(stage.id)"
      (dealDrop)="onDealDrop($event)"
    />
  }

</div>
