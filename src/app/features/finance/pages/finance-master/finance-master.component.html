<!-- finance-master.component.html -->

<div class="finance-container">
  <!-- Header -->
  <div class="finance-header">
    <div class="header-content">
      <div class="header-icon">
        <i class="pi pi-wallet"></i>
      </div>
      <div>
        <h1 class="header-title">Finance Management</h1>
        <p class="header-subtitle">จัดการใบแจ้งหนี้และใบเสร็จรับเงิน</p>
      </div>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="tab-navigation">
    @for (tab of tabs; track tab.id) {
      <button
        class="tab-btn"
        [class.active]="isActiveTab(tab.id)"
        (click)="setActiveTab(tab.id)"
      >
        <i class="pi" [ngClass]="tab.icon"></i>
        <span>{{ tab.label }}</span>
      </button>
    }
  </div>

  <!-- Tab Content -->
  <div class="tab-content">
    @if (isActiveTab('dashboard')) {
      <div class="tab-panel">
        <app-finance-dashboard />
      </div>
    }

    @if (isActiveTab('invoices')) {
      <div class="tab-panel">
        <app-invoice-management />
      </div>
    }

    @if (isActiveTab('pre-receipts')) {
      <div class="tab-panel">
        <app-pre-receipt-management />
      </div>
    }

    @if (isActiveTab('receipts')) {
      <div class="tab-panel">
        <app-receipt-management />
      </div>
    }
  </div>
</div>
