<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '480px' }"
  styleClass="edit-area-modal"
  (onHide)="onModalHide()"
>
  <ng-template pTemplate="header">
    <div class="modal-header">
      <h2 class="modal-title">
        <i class="pi pi-pencil"></i>
        แก้ไขรายละเอียดพื้นที่
        @if (currentArea()) {
          <span class="area-id-badge">{{ currentArea()!.roomNumber }}</span>
        }
      </h2>
    </div>
  </ng-template>

  <div class="modal-content">
    <form [formGroup]="areaForm" class="area-form">

      <!-- Room Number -->
      <div class="form-group">
        <label class="form-label required">หมายเลขห้อง (Room Number)</label>
        <input
          type="text"
          formControlName="roomNumber"
          class="form-input"
          placeholder="e.g., 2MD010B, KK-01"
          [class.error]="isFieldInvalid('roomNumber')"
        />
        @if (isFieldInvalid('roomNumber')) {
          <span class="error-message">กรุณากรอกหมายเลขห้อง</span>
        }
      </div>

      <!-- Area Type -->
      <div class="form-group">
        <label class="form-label required">ประเภทพื้นที่ (Area Type)</label>
        <select formControlName="type" class="form-select">
          @for (t of areaTypes; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label class="form-label required">สถานะ (Status)</label>
        <select formControlName="status" class="form-select">
          @for (s of areaStatuses; track s.value) {
            <option [value]="s.value">{{ s.label }}</option>
          }
        </select>
      </div>

      <!-- Size + Monthly Rent -->
      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label required">ขนาดพื้นที่ (ตร.ม.)</label>
          <input
            type="number"
            formControlName="size"
            class="form-input"
            placeholder="e.g., 25.5"
            min="0.1"
            step="0.1"
            [class.error]="isFieldInvalid('size')"
          />
          @if (isFieldInvalid('size')) {
            <span class="error-message">กรุณากรอกขนาดพื้นที่ที่ถูกต้อง</span>
          }
        </div>

        <div class="form-group flex-1">
          <label class="form-label">ค่าเช่า/เดือน (฿)</label>
          <input
            type="number"
            formControlName="monthlyRent"
            class="form-input"
            placeholder="e.g., 15000"
            min="0"
          />
        </div>
      </div>

      <!-- ✅ คำนวณ rate -->
      @if (ratePerSqm) {
        <div class="calculated-info">
          <i class="pi pi-calculator"></i>
          <span>อัตรา: ฿{{ ratePerSqm }} / ตร.ม. / เดือน</span>
        </div>
      }

      <!-- Notes -->
      <div class="form-group">
        <label class="form-label">หมายเหตุ (Notes)</label>
        <textarea
          formControlName="notes"
          class="form-input form-textarea"
          placeholder="บันทึกเพิ่มเติม..."
          rows="3"
        ></textarea>
      </div>

    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        <i class="pi pi-times"></i>
        ยกเลิก
      </button>
      <button
        type="button"
        class="btn-save"
        (click)="onSave()"
        [disabled]="!areaForm.valid || isSaving()"
      >
        <i class="pi pi-check"></i>
        {{ isSaving() ? 'กำลังบันทึก...' : 'บันทึก' }}
      </button>
    </div>
  </ng-template>
</p-dialog>
