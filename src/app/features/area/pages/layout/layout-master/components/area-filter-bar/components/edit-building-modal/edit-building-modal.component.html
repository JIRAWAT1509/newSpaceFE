<!-- /edit-building-modal.component.html -->

<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '520px' }"
  styleClass="edit-building-modal"
  (onHide)="onModalHide()"
>
  <!-- Header -->
  <ng-template pTemplate="header">
    <div class="modal-header">
      <h2 class="modal-title">
        <i class="pi pi-building"></i>
        Edit Building
      </h2>
    </div>
  </ng-template>

  <!-- Content -->
  <div class="modal-content">
    <form [formGroup]="buildingForm" class="building-form">

      <!-- Branch Selector -->
      <div class="form-group">
        <label class="form-label required">Branch</label>
        <p-select
          formControlName="branchId"
          [options]="branches()"
          optionLabel="nameTh"
          optionValue="id"
          placeholder="Select Branch"
          [class.error]="isFieldInvalid('branchId')"
        />
        @if (isFieldInvalid('branchId')) {
          <span class="error-message">Branch is required</span>
        }
      </div>

      <!-- Code -->
      <div class="form-group">
        <label class="form-label required">Building Code</label>
        <input
          type="text"
          formControlName="code"
          class="form-input"
          placeholder="e.g., BLD-001"
          [class.error]="isFieldInvalid('code')"
        />
        @if (isFieldInvalid('code')) {
          <span class="error-message">Building code is required</span>
        }
      </div>

      <!-- Name -->
      <div class="form-group">
        <label class="form-label required">Building Name</label>
        <input
          type="text"
          formControlName="name"
          class="form-input"
          placeholder="e.g., Imperial Tower 3"
          [class.error]="isFieldInvalid('name')"
        />
        @if (isFieldInvalid('name')) {
          <span class="error-message">Building name is required</span>
        }
      </div>

      <!-- Name Thai -->
      <div class="form-group">
        <label class="form-label">Building Name (Thai)</label>
        <input
          type="text"
          formControlName="nameTh"
          class="form-input"
          placeholder="e.g., อาคารอิมพีเรียล ทาวเวอร์ 3"
        />
      </div>

      <!-- Address Thai -->
      <div class="form-group">
        <label class="form-label">Address (Thai)</label>
        <input type="text" formControlName="addressTh" class="form-input" placeholder="ที่อยู่ (ไทย)" />
      </div>

      <!-- Address English -->
      <div class="form-group">
        <label class="form-label">Address (English)</label>
        <input type="text" formControlName="addressEn" class="form-input" placeholder="Address (EN)" />
      </div>

      <!-- Contact Person -->
      <div class="form-group">
        <label class="form-label">Contact Person (optional)</label>
        <input type="text" formControlName="contactPerson" class="form-input" placeholder="ชื่อผู้ติดต่อ" />
      </div>

      <!-- Contact Phone -->
      <div class="form-group">
        <label class="form-label">Contact Phone (optional)</label>
        <input type="text" formControlName="contactPhone" class="form-input" placeholder="โทรศัพท์" />
      </div>

      <!-- Optional Info -->
      <div class="form-group">
        <label class="form-label">Optional Info</label>
        <input type="text" formControlName="optionalInfo" class="form-input" placeholder="ข้อมูลเพิ่มเติม (ไม่บังคับ)" />
      </div>

    </form>
  </div>

  <!-- Footer -->
  <ng-template pTemplate="footer">
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        <i class="pi pi-times"></i>
        Cancel
      </button>
      <button
        type="button"
        class="btn-save"
        (click)="onSave()"
        [disabled]="!buildingForm.valid || isSaving()"
      >
        <i class="pi pi-check"></i>
        {{ isSaving() ? 'Saving...' : 'Save Building' }}
      </button>
    </div>
  </ng-template>
</p-dialog>
