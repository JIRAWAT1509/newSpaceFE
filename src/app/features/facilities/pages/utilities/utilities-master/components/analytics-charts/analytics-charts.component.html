<!-- analytics-charts.component.html -->

<div class="analytics-container">
  <!-- Filter Section -->
  <div class="filter-panel">
    <!-- Time Range Filter -->
    <div class="filter-group">
      <h3 class="filter-title">
        <i class="pi pi-calendar"></i>
        <span>Time Range</span>
      </h3>
      <div class="filter-options">
        @for (range of timeRanges; track range.id) {
          <button
            class="filter-chip"
            [class.active]="isTimeRangeSelected(range.id)"
            (click)="selectTimeRange(range.id)"
          >
            {{ range.label }}
          </button>
        }
      </div>

      <!-- Custom Date Range Picker -->
      @if (showCustomDatePicker()) {
        <div class="custom-date-range">
          <div class="date-input-group">
            <label>Start Date</label>
            <p-datepicker
              [(ngModel)]="customStartDate"
              (ngModelChange)="onCustomDateChange()"
              [showIcon]="true"
              dateFormat="dd/mm/yy"
              placeholder="Select start date"
            ></p-datepicker>
          </div>
          <div class="date-input-group">
            <label>End Date</label>
            <p-datepicker
              [(ngModel)]="customEndDate"
              (ngModelChange)="onCustomDateChange()"
              [showIcon]="true"
              dateFormat="dd/mm/yy"
              placeholder="Select end date"
            ></p-datepicker>
          </div>
        </div>
      }
    </div>

    <!-- Meter Type Filter -->
    <div class="filter-group">
      <h3 class="filter-title">
        <i class="pi pi-filter"></i>
        <span>Meter Type</span>
      </h3>
      <div class="filter-options">
        @for (filter of meterTypeFilters(); track filter.type) {
          <button
            class="filter-chip type-chip"
            [class.active]="isMeterTypeSelected(filter.type)"
            [style.border-color]="isMeterTypeSelected(filter.type) ? filter.color : '#e5e7eb'"
            (click)="selectMeterType(filter.type)"
          >
            <div class="chip-icon" [style.background-color]="filter.color">
              <i class="pi" [ngClass]="filter.icon"></i>
            </div>
            <span>{{ filter.label }}</span>
          </button>
        }
      </div>
    </div>
  </div>

  <!-- Charts Grid -->
  <div class="charts-grid">
    <!-- Chart 1: Consumption Trend -->
    <div class="chart-card large">
      <div class="chart-wrapper">
        <canvas #consumptionChart></canvas>
      </div>
    </div>

    <!-- Chart 2: Type Distribution -->
    <div class="chart-card">
      <div class="chart-wrapper">
        <canvas #typeDistributionChart></canvas>
      </div>
    </div>

    <!-- Chart 3: Top Consumers -->
    <div class="chart-card">
      <div class="chart-wrapper">
        <canvas #topConsumersChart></canvas>
      </div>
    </div>

    <!-- Chart 4: Cost Trend -->
    <div class="chart-card large">
      <div class="chart-wrapper">
        <canvas #costTrendChart></canvas>
      </div>
    </div>
  </div>
</div>
