<app-header
  #headerRef
  [style.--sidebar-width]="isMobile() ? '0' : (isSidebarExpanded() ? '16rem' : '5rem')"
  [isMobile]="isMobile()"
></app-header>

<!-- Backdrop when sidebar open on mobile -->
@if (isMobile() && isSidebarExpanded()) {
  <div
    class="sidebar-backdrop"
    (click)="closeSidebar()"
    role="button"
    tabindex="0"
    aria-label="Close menu"
  ></div>
}

<div class="app-layout">
  <div
    class="sidebar-wrapper"
    [class.sidebar-mobile-overlay]="isMobile()"
    [class.sidebar-mobile-open]="isMobile() && isSidebarExpanded()"
    [style.padding-top.px]="isMobile() ? headerHeight() : headerHeight()"
  >
    <app-sidebar
      class="h-full flex-shrink-0 transition-all duration-300"
      [style.padding-top.px]="isMobile() ? 0 : 0"
      [isMobileOverlay]="isMobile()"
    >
    </app-sidebar>
  </div>

  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    <main
      (scroll)="onContentScroll($event)"
      class="flex-1 overflow-x-hidden overflow-y-auto transition-all duration-300"
      [style.padding-top.px]="headerHeight()"
    >
      <div class="container mx-auto px-4 py-4 md:pt-[4.5rem] md:pb-8">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
