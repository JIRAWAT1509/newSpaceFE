<!-- header.component.html - RESPONSIVE FIXED -->

<header class="fixed top-0 left-0 right-0 z-50">
  <!-- Main Header -->
  <div
    class="bg-gradient-to-r from-primary via-primary to-secondary py-3 md:py-4 shadow-lg relative">
    <div class="flex items-center justify-between px-4 md:px-8">
      <!-- Left: Logo -->
      <div class="flex items-center flex-shrink-0">
        <h1
          (click)="onLogoClick()"
          class="text-primary-foreground text-lg md:text-2xl font-bold tracking-normal md:tracking-widest drop-shadow-lg cursor-pointer hover:opacity-90 transition-opacity duration-200 whitespace-nowrap"
          title="Go to Home"
        >
          {{ texts.logoText }}
        </h1>
      </div>

      <!-- Center: Navigation (aligned to content container) -->
      <div class="flex-1 pl-[var(--sidebar-width)]">
      <div class="content-container">
          <nav class="hidden md:flex md:space-x-3 lg:space-x-4 overflow-x-auto scrollbar-hide">
            <a
              *ngFor="let item of navigationItems; let i = index"
              [id]="'nav-item-' + i"
              (click)="setActiveMenuItem(item.primary_content)"
              [class.header-nav-item-active]="activeMenuItem === item.primary_content"
              class="header-nav-item"
            >
              <i class="header-nav-icon" [ngClass]="getNavIcon(item.primary_content)"></i>
            <span class="header-nav-label">{{ translateNav(item.primary_content) }}</span>
            <span
              *ngIf="activeMenuItem === item.primary_content"
              class="header-nav-underline bg-secondary"
            ></span>
            </a>
          </nav>
        </div>
      </div>

      <!-- Right: User Menu -->
      <div class="flex items-center space-x-2 md:space-x-4 flex-shrink-0">
          <!-- Search/Greeting Container - Always visible on tablet+ -->
          <div class="w-48 md:w-64 relative h-10">
            <div *ngIf="!isScrolled"
              class="absolute top-0 left-0 w-full h-full flex items-center justify-end text-primary-foreground text-sm md:text-base font-medium drop-shadow-md whitespace-nowrap overflow-hidden"
              [@slideDownSmallFaded]>
              <span class="truncate">{{ texts.greeting }}, {{ username }}!</span>
            </div>

            <div *ngIf="isScrolled" class="absolute top-0 left-0 w-full" [@slideDownSmall]>
              <div class="universal-search-wrapper">
                <div class="universal-search-container">
                  <svg
                    class="universal-search-icon"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  <input 
                    type="text" 
                    [(ngModel)]="searchQuery" 
                    (keyup.enter)="onSearch()"
                    [placeholder]="texts.searchPlaceholder"
                    class="universal-search-input"
                  />
                  @if (searchQuery) {
                    <button 
                      (click)="searchQuery = ''"
                      class="universal-search-clear"
                      type="button"
                    >
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                      </svg>
                    </button>
                  }
                </div>
              </div>
            </div>
          </div>

          <!-- Language Selector -->
          <div class="relative language-dropdown">
            <button (click)="toggleLanguageDropdown()"
              class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-card text-fg font-semibold text-xs md:text-sm flex items-center justify-center hover:bg-bg transition-colors duration-200 shadow-md flex-shrink-0">
              {{ currentLanguage.abbreviation }}
            </button>

            <!-- Language Dropdown -->
            <div *ngIf="isLanguageDropdownOpen"
              class="absolute right-0 mt-2 w-40 md:w-48 bg-card rounded-lg shadow-xl py-2 border border-border z-50">
              <button *ngFor="let lang of availableLanguages" (click)="selectLanguage(lang)"
                class="w-full px-3 md:px-4 py-2 text-left text-sm hover:bg-bg hover:text-fg transition-colors duration-150 flex items-center justify-between"
                [ngClass]="{
                'bg-bg text-fg': currentLanguage.code === lang.code
              }">
                <span class="font-medium">{{ lang.name }}</span>
                <span class="text-xs md:text-sm font-semibold">{{ lang.abbreviation }}</span>
              </button>
            </div>
          </div>

          <!-- User Profile -->
          <div class="relative profile-dropdown">
            <button (click)="toggleProfileDropdown()"
              class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-card flex items-center justify-center hover:bg-bg transition-colors duration-200 shadow-md overflow-hidden flex-shrink-0">
              <img *ngIf="hasProfilePicture && profilePictureUrl" [src]="profilePictureUrl" [alt]="username"
                class="w-full h-full object-cover" />
              <svg *ngIf="!hasProfilePicture" class="w-5 h-5 md:w-6 md:h-6 text-muted" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </button>

            <!-- Profile Dropdown -->
            <div *ngIf="isProfileDropdownOpen"
              class="absolute right-0 mt-2 w-48 md:w-56 bg-card rounded-lg shadow-xl py-2 border border-border z-50">
              <div class="px-3 md:px-4 py-3 border-b border-border">
                <p class="text-sm font-semibold text-fg truncate">
                  {{ username }}
                </p>
                <p class="text-xs text-muted">
                  {{ texts.profileLabel }}
                </p>
              </div>
              <button
                class="w-full px-3 md:px-4 py-2 text-left text-sm hover:bg-bg transition-colors duration-150">
                {{ texts.viewProfile }}
              </button>
              <button
                (click)="goToSettings()"
                class="w-full px-3 md:px-4 py-2 text-left text-sm hover:bg-bg transition-colors duration-150">
                {{ texts.settings }}
              </button>
              <hr class="my-2" />
              <button (click)="logout()"
                class="w-full px-3 md:px-4 py-2 text-left text-sm text-danger hover:bg-danger/10 transition-colors duration-150">
                {{ texts.logout }}
              </button>
            </div>
          </div>
      </div>
    </div>

    <!-- Large Search Bar (desktop only) -->
    <div *ngIf="!isScrolled" class="hidden md:block overflow-hidden"
      [@slideDown]>
      <div class="pl-[var(--sidebar-width)] search-bar-section">
        <div class="content-container pt-4 md:pt-5 pb-2 md:pb-2">
          <div class="max-w-4xl mx-auto">
            <div class="universal-search-wrapper universal-search-large">
              <div class="universal-search-container">
                <svg
                  class="universal-search-icon"
                  fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input 
                  type="text" 
                  [(ngModel)]="searchQuery" 
                  (keyup.enter)="onSearch()"
                  [placeholder]="texts.searchPlaceholder"
                  class="universal-search-input"
                />
                @if (searchQuery) {
                  <button 
                    (click)="searchQuery = ''"
                    class="universal-search-clear"
                    type="button"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                }
                <div class="universal-search-hint">
                  <kbd class="universal-search-key">⌘</kbd>
                  <kbd class="universal-search-key">K</kbd>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
