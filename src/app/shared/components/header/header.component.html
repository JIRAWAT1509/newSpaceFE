<!-- header.component.html - RESPONSIVE FIXED -->

<header class="fixed top-0 left-0 right-0 z-50">
  <!-- Main Header -->
  <div
    class="bg-gradient-to-r from-primary via-primary to-secondary py-2.5 md:py-3 md:pb-6 shadow-lg relative">
    <!-- Row 1: Logo + Right actions -->
    <div class="flex items-center justify-between px-4 sm:px-6 md:px-8 gap-3 min-h-[52px] md:min-h-14">
      <!-- Left: Hamburger (mobile) + Logo -->
      <div class="flex items-center flex-shrink-0 gap-2 min-w-0">
        <button
          type="button"
          class="md:hidden flex items-center justify-center w-11 h-11 -ml-1 rounded-xl text-primary-foreground hover:bg-white/10 active:bg-white/15 transition-colors touch-manipulation"
          (click)="toggleSidebar()"
          aria-label="Open menu"
        >
          <i class="pi pi-bars text-[1.25rem]"></i>
        </button>
        <h1
          (click)="onLogoClick()"
          class="text-primary-foreground text-xl md:text-2xl font-bold tracking-tight md:tracking-wide drop-shadow-md cursor-pointer hover:opacity-90 active:opacity-95 transition-opacity duration-200 whitespace-nowrap truncate"
          title="Go to Home"
        >
          {{ texts.logoText }}
        </h1>
      </div>

      <!-- Center: Navigation (desktop only) -->
      <div class="flex-1 pl-0 md:pl-[var(--sidebar-width)] min-w-0 hidden md:block">
        <div class="content-container">
          <nav class="flex items-center gap-4 lg:gap-5 overflow-x-auto scrollbar-hide">
            <a
              *ngFor="let item of navigationItems; let i = index"
              [id]="'nav-item-' + i"
              (click)="setActiveMenuItem(item.primary_content)"
              [class.header-nav-item-active]="activeMenuItem === item.primary_content"
              class="header-nav-item"
            >
              <i class="header-nav-icon" [ngClass]="getNavIcon(item.primary_content)"></i>
              <span class="header-nav-label">{{ translateNav(item.primary_content) }}</span>
              <span
                *ngIf="activeMenuItem === item.primary_content"
                class="header-nav-underline bg-secondary"
              ></span>
            </a>
          </nav>
        </div>
      </div>

      <!-- Right: User Menu -->
      <div class="flex items-center gap-2 sm:gap-3 md:gap-4 flex-shrink-0">
          <!-- Search/Greeting Container - smaller on mobile -->
          <div class="w-20 sm:w-32 md:w-64 relative h-9 md:h-9 flex-shrink-0 min-w-0">
            <div *ngIf="!isScrolled"
              class="absolute top-0 left-0 w-full h-full flex items-center justify-end text-primary-foreground text-xs sm:text-sm md:text-base font-medium drop-shadow-md"
              [@slideDownSmallFaded]>
              <span class="truncate">{{ texts.greeting }}, {{ username }}!</span>
            </div>

            <div *ngIf="isScrolled" class="absolute top-0 left-0 w-full hidden md:block" [@slideDownSmall]>
              <div class="universal-search-wrapper">
                <div class="universal-search-container">
                  <svg
                    class="universal-search-icon"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  <input 
                    type="text" 
                    [(ngModel)]="searchQuery" 
                    (keyup.enter)="onSearch()"
                    [placeholder]="texts.searchPlaceholder"
                    class="universal-search-input"
                  />
                  @if (searchQuery) {
                    <button 
                      (click)="searchQuery = ''"
                      class="universal-search-clear"
                      type="button"
                    >
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                      </svg>
                    </button>
                  }
                </div>
              </div>
            </div>
          </div>

          <!-- Language Selector -->
          <div class="relative language-dropdown">
            <button (click)="toggleLanguageDropdown()"
              class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-card text-fg font-semibold text-xs md:text-sm flex items-center justify-center hover:bg-bg active:scale-95 transition-all duration-200 shadow-md flex-shrink-0 touch-manipulation">
              {{ currentLanguage.abbreviation }}
            </button>

            <!-- Language Dropdown -->
            <div *ngIf="isLanguageDropdownOpen"
              class="absolute right-0 mt-2 w-40 md:w-48 bg-card rounded-xl shadow-xl py-2 border border-border z-50">
              <button *ngFor="let lang of availableLanguages" (click)="selectLanguage(lang)"
                class="w-full px-3 md:px-4 py-2 text-left text-sm hover:bg-bg hover:text-fg transition-colors duration-150 flex items-center justify-between"
                [ngClass]="{
                'bg-bg text-fg': currentLanguage.code === lang.code
              }">
                <span class="font-medium">{{ lang.name }}</span>
                <span class="text-xs md:text-sm font-semibold">{{ lang.abbreviation }}</span>
              </button>
            </div>
          </div>

          <!-- User Profile -->
          <div class="relative profile-dropdown">
            <button (click)="toggleProfileDropdown()"
              class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-card flex items-center justify-center hover:bg-bg active:scale-95 transition-all duration-200 shadow-md overflow-hidden flex-shrink-0 touch-manipulation ring-2 ring-transparent focus:ring-primary/30">
              <img *ngIf="hasProfilePicture && profilePictureUrl" [src]="profilePictureUrl" [alt]="username"
                class="w-full h-full object-cover" />
              <svg *ngIf="!hasProfilePicture" class="w-4 h-4 md:w-5 md:h-5 text-muted" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </button>

            <!-- Profile Dropdown -->
            <div *ngIf="isProfileDropdownOpen"
              class="absolute right-0 mt-2 w-48 md:w-56 bg-card rounded-xl shadow-xl py-2 border border-border z-50">
              <div class="px-3 md:px-4 py-3 border-b border-border">
                <p class="text-sm font-semibold text-fg truncate">
                  {{ username }}
                </p>
                <p class="text-xs text-muted">
                  {{ texts.profileLabel }}
                </p>
              </div>
              <button
                class="w-full px-3 md:px-4 py-2 text-left text-sm hover:bg-bg transition-colors duration-150">
                {{ texts.viewProfile }}
              </button>
              <button
                (click)="goToSettings()"
                class="w-full px-3 md:px-4 py-2 text-left text-sm hover:bg-bg transition-colors duration-150">
                {{ texts.settings }}
              </button>
              <hr class="my-2" />
              <button (click)="logout()"
                class="w-full px-3 md:px-4 py-2 text-left text-sm text-danger hover:bg-danger/10 transition-colors duration-150">
                {{ texts.logout }}
              </button>
            </div>
          </div>
      </div>
    </div>

    <!-- Mobile only: Universal Search bar (เหมือน Figma - แถบค้นหาด้านล่าง header) -->
    <div class="md:hidden px-4 pb-3 pt-1">
      <div class="universal-search-wrapper universal-search-mobile">
        <div class="universal-search-container">
          <svg class="universal-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch()"
            [placeholder]="texts.searchPlaceholder"
            class="universal-search-input"
          />
          @if (searchQuery) {
            <button (click)="searchQuery = ''" class="universal-search-clear" type="button">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          }
        </div>
      </div>
    </div>

    <!-- Large Search Bar (desktop only) - floating below header, centered -->
    <div *ngIf="!isScrolled" class="hidden md:block absolute left-1/2 -translate-x-1/2 -bottom-[4.75rem] z-10 w-full max-w-4xl px-4 md:px-6"
      [@slideDown]>
      <div class="search-bar-section">
        <div class="universal-search-wrapper universal-search-large">
          <div class="universal-search-container">
            <svg
              class="universal-search-icon"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input 
              type="text" 
              [(ngModel)]="searchQuery" 
              (keyup.enter)="onSearch()"
              [placeholder]="texts.searchPlaceholder"
              class="universal-search-input"
            />
            @if (searchQuery) {
              <button 
                (click)="searchQuery = ''"
                class="universal-search-clear"
                type="button"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Mobile only: Bottom navigation bar (เมนูด้านล่างบนมือถือ) -->
<nav
  class="bottom-nav md:hidden fixed left-0 right-0 bottom-0 z-40 flex items-center justify-around bg-card border-t border-border rounded-t-2xl shadow-[0_-8px_30px_-8px_rgba(0,0,0,0.12)] pb-[env(safe-area-inset-bottom)] pt-3 px-2 sm:px-4"
  aria-label="Main menu"
  role="navigation"
>
  <a
    *ngFor="let item of navigationItems; let i = index"
    [id]="'bottom-nav-' + i"
    (click)="setActiveMenuItem(item.primary_content)"
    [class.bottom-nav-item-active]="activeMenuItem === item.primary_content"
    class="bottom-nav-item flex-1 min-w-0 max-w-[76px]"
    role="button"
  >
    <span class="bottom-nav-icon-wrap">
      <i class="bottom-nav-icon" [ngClass]="getNavIcon(item.primary_content)"></i>
    </span>
    <span class="bottom-nav-label">{{ translateNav(item.primary_content) }}</span>
  </a>
</nav>
